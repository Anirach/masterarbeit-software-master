<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
<!-- Fragment für die Belegungstabelle mit Suchfunktion -->
<div th:fragment="belegungen-table(belegungen, kursId)" class="belegungen-table-container">
    <!-- Suchleiste -->
    <div class="row mb-3">
        <div class="col">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="belegungSearch" name="belegungSearch" class="form-control" placeholder="Suche nach Name oder Matrikelnummer..." data-cy="belegung-suche"
                       hx-post th:attr="hx-post=@{/kursbetreuer/htmx/belegungen/search/{kursId}(kursId=${kursId})}"
                       hx-trigger="keyup changed delay:300ms, search"
                       hx-target=".belegungen-table"
                       hx-indicator="#search-indicator">
            </div>
            <div class="form-text">Live-Suche nach Matrikelnummer, Name oder Status</div>
        </div>
        <div class="col-auto">
            <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" id="nurAktive" name="nurAktive" data-cy="nur-aktive-belegungen-checkbox" 
                       hx-post th:attr="hx-post=@{/kursbetreuer/htmx/belegungen/search/{kursId}(kursId=${kursId})}"
                       hx-trigger="change"
                       hx-target=".belegungen-table"
                       hx-include="#belegungSearch, #nurAktive"
                       hx-indicator="#search-indicator">
                <label class="form-check-label" for="nurAktive">
                    Nur aktive Belegungen
                </label>
            </div>
        </div>
        <div class="col-auto">
            <div id="search-indicator" class="htmx-indicator">
                <div class="spinner-border spinner-border-sm text-primary" role="status">
                    <span class="visually-hidden">Suche...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Belegungstabelle -->
    <div class="belegungen-table">
        <form id="massDeleteForm" th:action="@{/kursbetreuer/belegungen/massDelete}" method="post">
            <input type="hidden" name="kursId" th:value="${kursId}">
            
            <!-- Aktionen für Mehrfachauswahl -->
            <div id="bulkActions" class="mb-3 hide-initially">
                <button type="submit" class="btn btn-danger" data-cy="belegungen-massenloeschen-button" th:onclick="'return confirm(\\'' + #{confirm.delete.selected} + '\\');'">
                    <i class="bi bi-trash"></i> <span th:text="#{confirm.delete.selected}">Ausgewählte Belegungen löschen</span>
                </button>
                <button type="button" class="btn btn-outline-secondary ms-2" onclick="uncheckAll()">
                    <i class="bi bi-x-circle"></i> Auswahl aufheben
                </button>
                <span class="ms-3" id="selectedCount"></span>
            </div>
            
            <div class="table-responsive">
                <table class="table table-striped table-hover" data-cy="kursbelegung-table">
                    <thead class="table-light">
                        <tr>
                            <th>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="selectAll" onclick="toggleSelectAll(this)">
                                    <label class="form-check-label" for="selectAll"></label>
                                </div>
                            </th>
                            <th>Matrikelnummer</th>
                            <th>Student</th>
                            <th>Fortschritt</th>
                            <th>Startdatum</th>
                            <th>Enddatum</th>
                            <th>Status</th>
                            <th>Registriert</th>
                            <th>Aktionen</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="belegung : ${belegungen}" th:data-id="${belegung.matrikelnummer}">
                            <td>
                                <div class="form-check">
                                    <input class="form-check-input belegung-checkbox" type="checkbox" 
                                           th:id="${'belegung-' + belegung.id}" 
                                           name="belegungIds" 
                                           th:value="${belegung.id}"
                                           data-cy="belegung-checkbox"
                                           onchange="updateSelectedCount()">
                                    <label class="form-check-label" th:for="${'belegung-' + belegung.id}"></label>
                                </div>
                            </td>
                            <td th:text="${belegung.matrikelnummer}"></td>
                            <td>
                                <a th:if="${belegung.studentId != null}" 
                                   th:href="@{/kursbetreuer/nutzer/student/{id}(id=${belegung.studentId})}" 
                                   th:text="${belegung.studentName}">Studentenname</a>
                                <span th:if="${belegung.studentId == null}" 
                                      th:text="${belegung.studentName}">Studentenname</span>
                            </td>
                            <td>
                                <div th:if="${belegung.fortschrittProzent != null}" class="d-flex align-items-center">
                                    <div class="progress progress-thick flex-grow-1" style="min-width: 100px;">
                                        <div class="progress-bar" role="progressbar" 
                                             th:style="'width: ' + ${belegung.fortschrittProzent} + '%'"
                                             th:aria-valuenow="${belegung.fortschrittProzent}" 
                                             aria-valuemin="0" aria-valuemax="100"
                                             th:classappend="${belegung.fortschrittProzent >= 80} ? 'bg-success' : (${belegung.fortschrittProzent >= 50} ? 'bg-warning' : 'bg-danger')">
                                            <span th:text="${#numbers.formatDecimal(belegung.fortschrittProzent, 0, 0) + '%'}"></span>
                                        </div>
                                    </div>
                                    <small class="ms-2 text-muted" 
                                           th:text="'(' + ${belegung.abgeschlosseneTeilaufgaben} + '/' + ${belegung.gesamtTeilaufgaben} + ')'">
                                    </small>
                                </div>
                                <span th:if="${belegung.fortschrittProzent == null}" class="text-muted">-</span>
                            </td>
                            <td th:text="${#temporals.format(belegung.startDatum, 'dd.MM.yyyy')}"></td>
                            <td th:text="${belegung.endDatum != null ? #temporals.format(belegung.endDatum, 'dd.MM.yyyy') : 'Unbegrenzt'}"></td>
                            <td>
                                <span th:if="${belegung.aktiv}" class="badge bg-success">Aktiv</span>
                                <span th:unless="${belegung.aktiv}" class="badge bg-danger">Inaktiv</span>
                            </td>
                            <td>
                                <span th:if="${belegung.istRegistriert}" class="badge bg-success">Ja</span>
                                <span th:unless="${belegung.istRegistriert}" class="badge bg-warning text-dark">Nein</span>
                            </td>
                            <td>
                                <div class="btn-group" role="group">
                                    <a th:if="${belegung.studentId != null && belegung.istRegistriert}" 
                                       th:href="@{/kursbetreuer/fortschritt/student/{belegungId}(belegungId=${belegung.id})}" 
                                       class="btn btn-sm btn-info" title="Fortschritt anzeigen" data-cy="belegung-fortschritt-button">
                                        <i class="bi bi-graph-up"></i>
                                    </a>
                                    <a th:href="@{/kursbetreuer/belegungen/edit/{id}(id=${belegung.id})}" 
                                       class="btn btn-sm btn-primary" th:title="#{action.edit}" data-cy="belegung-bearbeiten-button">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-danger" th:title="#{action.delete}"
                                            th:attr="data-belegung-id=${belegung.id}"
                                            data-cy="belegung-loeschen-button"
                                            onclick="deleteSingleBelegung(this)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${belegungen.empty}">
                            <td colspan="9" class="text-center">Keine Belegungen gefunden.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </form>

        <!-- JavaScript für die Mehrfachauswahl und Einzellöschung -->
        <script th:inline="javascript">
            // Thymeleaf-Variablen für URLs
            const deleteUrlTemplate = /*[[@{/kursbetreuer/belegungen/delete/{id}(id='')}]]*/ '/kursbetreuer/belegungen/delete/';
            
            function toggleSelectAll(checkbox) {
                const checkboxes = document.querySelectorAll('.belegung-checkbox');
                checkboxes.forEach(cb => cb.checked = checkbox.checked);
                updateSelectedCount();
            }

            function uncheckAll() {
                document.getElementById('selectAll').checked = false;
                const checkboxes = document.querySelectorAll('.belegung-checkbox');
                checkboxes.forEach(cb => cb.checked = false);
                updateSelectedCount();
            }

            function updateSelectedCount() {
                const checkedBoxes = document.querySelectorAll('.belegung-checkbox:checked');
                const bulkActions = document.getElementById('bulkActions');
                const selectedCount = document.getElementById('selectedCount');

                if (checkedBoxes.length > 0) {
                    bulkActions.classList.remove('hide-initially');
                    selectedCount.textContent = `${checkedBoxes.length} Belegung(en) ausgewählt`;
                } else {
                    bulkActions.classList.add('hide-initially');
                    selectedCount.textContent = '';
                }
            }

            // Funktion zum Löschen einer einzelnen Belegung
            function deleteSingleBelegung(button) {
                const belegungId = button.getAttribute('data-belegung-id');

                if (!belegungId) {
                    console.error('Keine Belegungs-ID gefunden');
                    return;
                }

                if (!confirm('Sind Sie sicher, dass Sie diese Belegung löschen möchten?')) {
                    return;
                }
                
                // CSRF-Token aus den Meta-Tags holen
                const csrfToken = document.querySelector("meta[name='_csrf']").getAttribute("content");
                
                // Formular mit CSRF-Token erstellen
                const form = document.createElement('form');
                form.method = 'post';
                form.action = deleteUrlTemplate + belegungId;
                form.style.display = 'none';
                
                // CSRF-Token hinzufügen
                const csrfInput = document.createElement('input');
                csrfInput.type = 'hidden';
                csrfInput.name = '_csrf';
                csrfInput.value = csrfToken;
                form.appendChild(csrfInput);
                
                // Formular absenden und den Redirect folgen
                document.body.appendChild(form);
                form.submit();
            }
            
            // Initialisierung
            document.addEventListener('DOMContentLoaded', function() {
                updateSelectedCount();
            });
        </script>
    </div>
</div>
</body>

</html>
