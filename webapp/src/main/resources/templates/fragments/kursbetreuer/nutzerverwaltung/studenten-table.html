<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
<!-- Fragment für die Studententabelle mit Suchfunktion -->
<div th:fragment="studenten-table(studenten)" class="studenten-table-container">
    <!-- Suchleiste -->
    <div class="row mb-3">
        <div class="col">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="studentSearch" name="studentSearch" class="form-control" placeholder="Suche nach Name, Matrikelnummer, Email..." data-cy="student-suche"
                       hx-post th:attr="hx-post=@{/kursbetreuer/htmx/nutzer/search/studenten}"
                       hx-trigger="keyup changed delay:300ms, search"
                       hx-target=".studenten-table"
                       hx-indicator="#student-search-indicator">
            </div>
            <div class="form-text">Live-Suche nach Matrikelnummer, Name, Email oder Status</div>
        </div>
        <div class="col-auto">
            <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" id="nurRegistriert" name="nurRegistriert" data-cy="nur-registrierte-studenten-checkbox" 
                       hx-post th:attr="hx-post=@{/kursbetreuer/htmx/nutzer/search/studenten}"
                       hx-trigger="change"
                       hx-target=".studenten-table"
                       hx-include="#studentSearch, #nurRegistriert"
                       hx-indicator="#student-search-indicator">
                <label class="form-check-label" for="nurRegistriert">
                    Nur registrierte Studenten
                </label>
            </div>
        </div>
        <div class="col-auto">
            <div id="student-search-indicator" class="htmx-indicator">
                <div class="spinner-border spinner-border-sm text-primary" role="status">
                    <span class="visually-hidden">Suche...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Studententabelle -->
    <div class="studenten-table">
        <div class="table-responsive">
            <table class="table table-striped table-hover" id="studenten-table">
                <thead class="table-light">
                    <tr>
                        <th>Matrikelnummer</th>
                        <th>Name</th>
                        <th>E-Mail</th>
                        <th>Status</th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student : ${studenten}" th:id="'student-' + ${student.id}">
                        <td th:text="${student.matrikelnummer}">12345678</td>
                        <td>
                            <span th:if="${student.vorname != null and student.nachname != null}" 
                                  th:text="${student.vorname + ' ' + student.nachname}">Max Mustermann</span>
                            <span th:if="${student.vorname == null or student.nachname == null}" 
                                  class="text-muted fst-italic">Nicht registriert</span>
                        </td>
                        <td th:text="${student.email ?: 'Nicht registriert'}" th:class="${student.email == null ? 'text-muted fst-italic' : ''}">
                            max.mustermann@example.com
                        </td>
                        <td>
                            <span th:if="${student.istRegistriert}" class="badge bg-success">Registriert</span>
                            <span th:unless="${student.istRegistriert}" class="badge bg-warning text-dark">Nicht registriert</span>
                        </td>
                        <td>
                            <div class="btn-group" role="group">
                                <a th:href="@{/kursbetreuer/nutzer/student/{id}(id=${student.id})}" 
                                   class="btn btn-sm btn-primary" data-cy="student-details-button"
                                   title="Details anzeigen">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/kursbetreuer/nutzer/student/{id}/loeschen(id=${student.id})}" 
                                   class="btn btn-sm btn-danger" data-cy="student-loeschen-button"
                                   title="Löschen">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${studenten.empty}">
                        <td colspan="5" class="text-center">Keine Studenten gefunden</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>

</html>
