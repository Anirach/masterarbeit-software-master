<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Fragment für die Kurstabelle -->
<div th:fragment="kursliste(kurse)" class="card shadow-sm">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h2 class="card-title h5 mb-0">Alle Kurse</h2>
        <div>
            <a th:href="@{/kursbetreuer/kurse/import}" class="btn btn-sm btn-outline-light me-2" data-cy="kurs-importieren-button">
                <i class="bi bi-upload"></i> Kurs importieren
            </a>
            <a th:href="@{/kursbetreuer/kurse/neu}" class="btn btn-sm btn-light" data-cy="neuer-kurs-button">
                <i class="bi bi-plus-circle"></i> Neuen Kurs anlegen
            </a>
        </div>
    </div>
    <div class="card-body p-0">
        <!-- Wenn Kurse vorhanden sind, werden sie hier angezeigt -->
        <div th:if="${kurse != null && !kurse.isEmpty()}" class="table-responsive">
            <table class="table table-hover" data-cy="kurse">
                <thead>
                <tr>
                    <th class="ps-4">Kursname</th>
                    <th>Kurseinheiten</th>
                    <th class="pe-4">Aktionen</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="kurs : ${kurse}" th:data-cy-kurs="${kurs.name}">
                    <td class="ps-4" th:text="${kurs.name}">Beispielkurs</td>
                    <td th:text="${kurs.kurseinheiten != null ? kurs.kurseinheiten.size() : 0}">7</td>
                    <td class="pe-4">
                        <div class="btn-group btn-group-sm">
                            <a th:href="@{/kursbetreuer/kurse/{id}(id=${kurs.id})}" class="btn btn-sm btn-primary" data-cy="kurs-ansehen-button" title="Ansehen">
                                <i class="bi bi-eye"></i> <span th:text="#{action.view}">Ansehen</span>
                            </a>
                            <a th:href="@{/kursbetreuer/fortschritt/kurs/{id}(id=${kurs.id})}" class="btn btn-sm btn-success" data-cy="fortschritt-button" title="Fortschritt">
                                <i class="bi bi-graph-up"></i> Fortschritt
                            </a>
                            <a th:href="@{/kursbetreuer/kurse/{id}/loeschen(id=${kurs.id})}" class="btn btn-sm btn-danger" data-cy="kurs-loeschen-button" th:title="#{action.delete}">
                                <i class="bi bi-trash"></i> <span th:text="#{action.delete}">Löschen</span>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Wenn keine Kurse vorhanden sind -->
        <div th:if="${kurse == null || kurse.isEmpty()}" class="p-4 px-5 text-center">
            <p class="text-muted mb-3">Es sind noch keine Kurse vorhanden.</p>
            <p>Erstellen Sie einen neuen Kurs, um Lehrmaterial und Übungsaufgaben anzulegen.</p>
            <a th:href="@{/kursbetreuer/kurse/neu}" class="btn btn-primary mt-2">
                <i class="bi bi-plus-circle"></i> Ersten Kurs anlegen
            </a>
        </div>
    </div>
</div>


</body>
</html>
