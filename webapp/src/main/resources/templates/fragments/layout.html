<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title th:text="${title} + ' - ' + #{app.title}">LLM-Übungssystem</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
    <link rel="manifest" th:href="@{/site.webmanifest}">
    <link rel="stylesheet" th:href="@{/webjars/easymde/dist/easymde.min.css}" />
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}" />
    <link rel="stylesheet" th:href="@{/webjars/katex/dist/katex.min.css}" />
    <!-- Main consolidated stylesheet -->
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>

<body>
    <!-- Header -->
    <header th:fragment="header">
        <div class="fernuni-header">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <a th:href="@{/}" class="text-decoration-none d-flex align-items-center">
                            <img th:src="@{/images/knlogo.png}" alt="FernUniversität in Hagen" class="img-fluid" style="max-height: 90px;">
                            <span class="d-none d-md-inline ms-3 fs-4 fw-normal text-dark" th:text="#{app.title}">LLM-Übungssystem</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Navigation -->
        <nav class="fernuni-nav">
            <div class="container">
                <div class="d-flex justify-content-between">
                    <ul class="nav">
                        <li class="nav-item" th:if="${!#authorization.expression('isAuthenticated()')}">
                            <a class="nav-link" th:href="@{/login}" th:text="#{nav.login}">Anmeldung</a>
                        </li>
                        <li class="nav-item" th:if="${!#authorization.expression('isAuthenticated()')}">
                            <a class="nav-link" th:href="@{/information}" th:text="#{nav.information}">Information</a>
                        </li>
                        <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                            <a class="nav-link" th:href="@{/dashboard}" th:text="#{nav.home}">Home</a>
                        </li>
                        <li class="nav-item" th:if="${#authorization.expression('hasRole(''ROLE_KURSBETREUER'')')}">
                            <a class="nav-link" th:href="@{/kursbetreuer/kursverwaltung}" th:text="#{nav.course.management}">Kursverwaltung</a>
                        </li>
                        <li class="nav-item" th:if="${#authorization.expression('hasRole(''ROLE_KURSBETREUER'')')}">
                            <a class="nav-link" th:href="@{/kursbetreuer/nutzer}" th:text="#{nav.user.management}">Nutzerverwaltung</a>
                        </li>
                        <li class="nav-item" th:if="${#authorization.expression('hasRole(''ROLE_KURSBETREUER'')')}">
                            <a class="nav-link" th:href="@{/kursbetreuer/aktivitaeten}" th:text="#{nav.activities.overview}">Aktivitätenübersicht</a>
                        </li>
                    </ul>
                    
                    <div class="d-flex align-items-center">
                        <!-- Language Switcher -->
                        <div class="nav-item dropdown me-3">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="languageDropdown" 
                               role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-globe me-1"></i>
                                <span class="d-none d-md-inline" th:text="#{lang.current}">Sprache</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
                                <li>
                                    <a class="dropdown-item" th:href="@{/change-language(lang='de')}" 
                                       th:classappend="${#locale.language == 'de'} ? 'active' : ''">
                                        <i class="bi bi-check me-2" th:if="${#locale.language == 'de'}"></i>
                                        <span th:if="${#locale.language != 'de'}" class="me-4"></span>
                                        <span th:text="#{lang.switch.german}">Deutsch</span>
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" th:href="@{/change-language(lang='en')}"
                                       th:classappend="${#locale.language == 'en'} ? 'active' : ''">
                                        <i class="bi bi-check me-2" th:if="${#locale.language == 'en'}"></i>
                                        <span th:if="${#locale.language != 'en'}" class="me-4"></span>
                                        <span th:text="#{lang.switch.english}">English</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                        
                        <!-- User Info mit Dropdown für Logout -->
                        <div class="nav-item dropdown" th:if="${#authorization.expression('isAuthenticated()')}">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button" 
                               data-bs-toggle="dropdown" aria-expanded="false" data-cy="user-dropdown">
                                <i class="bi bi-person-circle me-1"></i>
                                <span th:if="${#authorization.expression('hasRole(''ROLE_STUDENT'')')}" 
                                      th:text="${#authentication.principal.vorname + ' ' + #authentication.principal.nachname}">Name des Nutzers</span>
                                <span th:if="${#authorization.expression('hasRole(''ROLE_KURSBETREUER'')')}" 
                                      th:text="${#authentication.principal.vorname + ' ' + #authentication.principal.nachname}">Name des Kursbetreuers</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                                <li>
                                    <a th:href="@{/profil}" class="dropdown-item" data-cy="mein-profil-link">
                                        <i class="bi bi-person me-2"></i><span th:text="#{nav.my.profile}">Mein Profil</span>
                                    </a>
                                </li>
                                <li>
                                    <form th:action="@{/logout}" method="post">
                                        <button type="submit" class="dropdown-item" data-cy="logout-link">
                                            <i class="bi bi-box-arrow-right me-2"></i><span th:text="#{nav.logout}">Abmelden</span>
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    
    <!-- Breadcrumbs -->
    <div th:fragment="breadcrumbs(items)" class="breadcrumb-section">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                    <li class="breadcrumb-item" th:each="item, iterStat : ${items}" th:classappend="${iterStat.last} ? 'active' : ''">
                        <a th:if="${!iterStat.last}" th:href="${item.url}" th:text="${item.label}">Item</a>
                        <span th:if="${iterStat.last}" th:text="${item.label}">Current Item</span>
                    </li>
                </ol>
            </nav>
        </div>
    </div>
    
    <!-- Content placeholder -->
    <main class="main-content" th:fragment="content">
        <div class="container">
            <div th:replace="${content}">
                <!-- Content wird hier eingefügt -->
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer th:fragment="footer" class="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>LLM-Übungssystem</h5>
                </div>
                <div class="col-md-6 text-md-end">
                    <p>&copy; 2025 FernUniversität in Hagen</p>
                </div>
            </div>
        </div>
    </footer>
    
    <!-- JavaScript includes -->
    <div th:fragment="scripts">
        <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
        <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
        <script th:src="@{/webjars/sortablejs/Sortable.min.js}"></script>
        <script th:src="@{/webjars/katex/dist/katex.min.js}"></script>
        <script th:src="@{/webjars/katex/dist/contrib/auto-render.min.js}"></script>
        <script th:src="@{/webjars/easymde/dist/easymde.min.js}"></script>
        <script th:src="@{/js/material-tree-state.js}"></script>
        <script th:src="@{/js/htmx-csrf.js}"></script>
        <script th:src="@{/js/katex-renderer.js}"></script>
        <script th:src="@{/js/markdown-editor.js}"></script>
    </div>
</body>

</html>
