name: "llm-uebungssystem"

services:
  mariadb:
    image: mariadb:11.8
    restart: always
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: 1
      MARIADB_DATABASE: webapp_db
      MARIADB_USER: "webapp"
      MARIADB_PASSWORD: "sLgUfGNsTVXZUoxY"
    volumes:
      - mariadb-data-app:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
  webapp:
    image: registry.gitlab.com/masterarbeit-jharnack/masterarbeit-software:0.0.1
    build:
      context: .
      args:
        - JAR_FILE=webapp/target/*.jar
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # Datenbank-Konfiguration
      SPRING_DATASOURCE_URL: "jdbc:mariadb://mariadb:3306/webapp_db"
      SPRING_DATASOURCE_USERNAME: "webapp"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"

      # KI-Anbindung
      SPRING_AI_OPENAI_API_KEY: "${OPENAI_API_KEY}"

      # Testdaten erstellen, falls Datenbank leer ist
      APP_TEST_DATA_ENABLED: "true"

      # Falls Anwendung hinter Apache httpd oder nginx betrieben wird:
      # SERVER_FORWARD_HEADERS_STRATEGY: "framework"

    ports:
      - "8080:8080"
volumes:
  mariadb-data-app: